<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Finanças Pessoais</title>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 min-h-screen flex items-center justify-center p-4 sm:p-6 relative overflow-x-hidden select-none">

    <!-- Ambient Glow / Decorative Background Shapes -->
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-emerald-500/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-teal-500/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-emerald-600/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Main Centered Card -->
    <div class="w-full max-w-[440px] bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl shadow-slate-950/50 border border-white/20 overflow-hidden relative z-10 my-4 transition-all duration-300">
        
        <!-- Header Branding & Visual Identity -->
        <div class="pt-8 pb-6 px-6 sm:px-8 text-center border-b border-slate-100">
            <!-- Icon Badge -->
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-500 text-white shadow-lg shadow-emerald-600/30 mb-3.5 transform hover:scale-105 transition-transform duration-300">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            <!-- Title -->
            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">
                Finanças Pessoais
            </h1>
            <!-- Subtitle -->
            <p class="text-xs sm:text-sm text-slate-500 font-normal mt-1.5 max-w-xs mx-auto">
                Organize seu dinheiro, contas e caixinhas
            </p>
        </div>

        <div class="p-6 sm:p-8 pt-6">
            <!-- Stylized Segmented Tab Switcher (Toggle) -->
            <div class="bg-slate-100/90 p-1.5 rounded-2xl flex gap-1 mb-6 border border-slate-200/60 shadow-inner">
                <button type="button" id="tab-login"
                        class="flex-1 py-2.5 text-center text-sm font-semibold rounded-xl transition-all duration-200 bg-white text-slate-900 shadow-sm">
                    Entrar
                </button>
                <button type="button" id="tab-register"
                        class="flex-1 py-2.5 text-center text-sm font-medium rounded-xl transition-all duration-200 text-slate-500 hover:text-slate-800">
                    Criar Conta
                </button>
            </div>

            <!-- Form: Login -->
            <form id="form-login" class="space-y-4" autocomplete="on">
                <!-- E-mail Input -->
                <div>
                    <label for="login-email" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">
                        E-mail
                    </label>
                    <div class="relative flex items-center">
                        <div class="absolute left-3.5 text-slate-400 pointer-events-none flex items-center justify-center">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                            </svg>
                        </div>
                        <input type="email" id="login-email" required placeholder="seu.email@exemplo.com"
                               class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/15 outline-none transition-all text-sm bg-slate-50/50 hover:bg-white focus:bg-white text-slate-800 placeholder-slate-400 font-medium">
                    </div>
                </div>

                <!-- Password Input with Reveal/Hide Toggle -->
                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label for="login-password" class="block text-xs font-bold uppercase tracking-wider text-slate-600">
                            Senha
                        </label>
                        <button type="button" id="btn-forgot-password" class="text-xs font-semibold text-emerald-600 hover:text-emerald-700 hover:underline transition">
                            Esqueci minha senha
                        </button>
                    </div>
                    <div class="relative flex items-center">
                        <div class="absolute left-3.5 text-slate-400 pointer-events-none flex items-center justify-center">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                        </div>
                        <input type="password" id="login-password" required placeholder="••••••••"
                               class="w-full pl-10 pr-11 py-3 rounded-xl border border-slate-200 focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/15 outline-none transition-all text-sm bg-slate-50/50 hover:bg-white focus:bg-white text-slate-800 placeholder-slate-400 font-medium">
                        
                        <!-- Toggle Password Button -->
                        <button type="button" class="toggle-password-btn absolute right-3 p-1 text-slate-400 hover:text-slate-600 rounded-lg transition focus:outline-none"
                                data-target="login-password" title="Mostrar/ocultar senha">
                            <svg class="icon-eye w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                            <svg class="icon-eye-off w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Submit Button with Spinner -->
                <button type="submit"
                        class="btn-submit w-full mt-3 py-3.5 px-4 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 active:scale-[0.99] text-white font-semibold rounded-xl shadow-lg shadow-emerald-600/25 hover:shadow-emerald-600/35 transition-all duration-200 text-sm flex items-center justify-center gap-2 cursor-pointer disabled:opacity-75 disabled:cursor-not-allowed">
                    <span class="btn-spinner hidden">
                        <svg class="animate-spin w-4 h-4 text-white" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </span>
                    <span class="btn-text">Entrar</span>
                </button>

                <!-- Switch to Register Microcopy -->
                <p class="text-center text-xs text-slate-500 mt-4">
                    Ainda não tem uma conta?
                    <button type="button" id="link-to-register" class="font-bold text-emerald-600 hover:text-emerald-700 hover:underline transition">
                        Criar conta gratuitamente
                    </button>
                </p>
            </form>

            <!-- Form: Register -->
            <form id="form-register" class="space-y-4 hidden" autocomplete="on">
                <!-- Name Input -->
                <div>
                    <label for="reg-name" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">
                        Nome Completo
                    </label>
                    <div class="relative flex items-center">
                        <div class="absolute left-3.5 text-slate-400 pointer-events-none flex items-center justify-center">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                        </div>
                        <input type="text" id="reg-name" required placeholder="Seu Nome e Sobrenome"
                               class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/15 outline-none transition-all text-sm bg-slate-50/50 hover:bg-white focus:bg-white text-slate-800 placeholder-slate-400 font-medium">
                    </div>
                </div>

                <!-- E-mail Input -->
                <div>
                    <label for="reg-email" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">
                        E-mail
                    </label>
                    <div class="relative flex items-center">
                        <div class="absolute left-3.5 text-slate-400 pointer-events-none flex items-center justify-center">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                            </svg>
                        </div>
                        <input type="email" id="reg-email" required placeholder="seu.email@exemplo.com"
                               class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/15 outline-none transition-all text-sm bg-slate-50/50 hover:bg-white focus:bg-white text-slate-800 placeholder-slate-400 font-medium">
                    </div>
                </div>

                <!-- Password Input with Reveal/Hide Toggle -->
                <div>
                    <label for="reg-password" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">
                        Senha
                    </label>
                    <div class="relative flex items-center">
                        <div class="absolute left-3.5 text-slate-400 pointer-events-none flex items-center justify-center">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                        </div>
                        <input type="password" id="reg-password" required minlength="6" placeholder="Mínimo 6 caracteres"
                               class="w-full pl-10 pr-11 py-3 rounded-xl border border-slate-200 focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/15 outline-none transition-all text-sm bg-slate-50/50 hover:bg-white focus:bg-white text-slate-800 placeholder-slate-400 font-medium">
                        
                        <!-- Toggle Password Button -->
                        <button type="button" class="toggle-password-btn absolute right-3 p-1 text-slate-400 hover:text-slate-600 rounded-lg transition focus:outline-none"
                                data-target="reg-password" title="Mostrar/ocultar senha">
                            <svg class="icon-eye w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                            <svg class="icon-eye-off w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                            </svg>
                        </button>
                    </div>
                    <p class="text-[11px] text-slate-400 mt-1 pl-1">
                        Use no mínimo 6 caracteres com letras e números.
                    </p>
                </div>

                <!-- Submit Button with Spinner -->
                <button type="submit"
                        class="btn-submit w-full mt-3 py-3.5 px-4 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 active:scale-[0.99] text-white font-semibold rounded-xl shadow-lg shadow-emerald-600/25 hover:shadow-emerald-600/35 transition-all duration-200 text-sm flex items-center justify-center gap-2 cursor-pointer disabled:opacity-75 disabled:cursor-not-allowed">
                    <span class="btn-spinner hidden">
                        <svg class="animate-spin w-4 h-4 text-white" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </span>
                    <span class="btn-text">Criar Minha Conta</span>
                </button>

                <!-- Switch to Login Microcopy -->
                <p class="text-center text-xs text-slate-500 mt-4">
                    Já tem uma conta cadastrada?
                    <button type="button" id="link-to-login" class="font-bold text-emerald-600 hover:text-emerald-700 hover:underline transition">
                        Entrar na conta
                    </button>
                </p>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
</body>
</html>
