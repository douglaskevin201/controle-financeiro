<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Controle Financeiro Pessoal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
        <!-- Header -->
        <div class="bg-gradient-to-r from-emerald-600 to-teal-700 p-8 text-white text-center">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-white/20 backdrop-blur-md mb-3">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold">Finanças Pessoais</h1>
            <p class="text-emerald-100 text-sm mt-1">Organize seu dinheiro, contas e caixinhas</p>
        </div>

        <!-- Tabs -->
        <div class="flex border-b border-slate-100 bg-slate-50/50">
            <button id="tab-login" class="flex-1 py-3.5 text-center text-sm font-semibold text-emerald-600 border-b-2 border-emerald-600 transition-colors">
                Entrar
            </button>
            <button id="tab-register" class="flex-1 py-3.5 text-center text-sm font-medium text-slate-500 hover:text-slate-700 transition-colors">
                Criar Conta
            </button>
        </div>

        <!-- Body Form Container -->
        <div class="p-8">
            <!-- Form Login -->
            <form id="form-login" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">E-mail</label>
                    <input type="email" id="login-email" required placeholder="seu.email@exemplo.com"
                           class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Senha</label>
                    <input type="password" id="login-password" required placeholder="••••••••"
                           class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm">
                </div>
                <button type="submit"
                        class="w-full mt-2 py-3 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-lg shadow-md hover:shadow-lg transition-all text-sm">
                    Entrar
                </button>
            </form>

            <!-- Form Register -->
            <form id="form-register" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Nome Completo</label>
                    <input type="text" id="reg-name" required placeholder="Seu Nome"
                           class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">E-mail</label>
                    <input type="email" id="reg-email" required placeholder="seu.email@exemplo.com"
                           class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Senha</label>
                    <input type="password" id="reg-password" required minlength="6" placeholder="Mínimo 6 caracteres"
                           class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm">
                </div>
                <button type="submit"
                        class="w-full mt-2 py-3 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-lg shadow-md hover:shadow-lg transition-all text-sm">
                    Criar Minha Conta
                </button>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
</body>
</html>
